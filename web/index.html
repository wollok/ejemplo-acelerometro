<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Control del juego</title>
  <link rel="stylesheet" href="./style.css" />
</head>

<body>
  <main class="panel">
    <div class="controls">
      <label for="ip">IP de la laptop</label>
      <input id="ip" type="text" inputmode="decimal" autocomplete="off" placeholder="Ej.: 192.168.1.25" />
      <small>Ingresá la IP que muestra Vite en la línea “Network”.</small>
      <button id="start" type="button">Conectar</button>
    </div>

    <div id="status" role="status" aria-live="polite">Sin conexión</div>

    <section id="mode-picker" class="mode-picker" aria-label="Elegir control" hidden>
      <h1>¿Cómo querés moverte?</h1>
      <button id="choose-joystick" type="button">Usar joystick</button>
      <button id="choose-sensor" type="button">Usar sensor del celular</button>
    </section>

    <button id="change-mode" class="change-mode" type="button" hidden>Cambiar modo</button>

    <div class="compass" aria-label="Brújula visual">
      <div class="direction n">N</div>
      <div class="direction s">S</div>
      <div class="direction e">E</div>
      <div class="direction w">W</div>
      <div id="needle" class="needle"></div>
      <div class="center"></div>
    </div>

    <section id="joystick-controls" class="mode-controls" aria-label="Joystick" hidden>
      <div id="joystick-pad" class="joystick-pad" role="group" aria-label="Palanca analógica">
        <div id="joystick-thumb" class="joystick-thumb"></div>
      </div>
    </section>

    <section id="sensor-controls" class="mode-controls" aria-label="Sensor del celular" hidden>
      <p>Inclina y mueve el celular para dirigir la bolita.</p>
    </section>

    <div class="joystick-buttons" role="group" aria-label="Botones del juego">
      <button id="button-a" class="joystick-button button-a" type="button" disabled>A</button>
      <button id="button-b" class="joystick-button button-b" type="button" disabled>B</button>
      <button id="button-c" class="joystick-button button-c" type="button" disabled>C</button>
    </div>
  </main>

  <script>
    const ipInput = document.getElementById("ip");
    const statusElement = document.getElementById("status");
    const startButton = document.getElementById("start");
    const modePicker = document.getElementById("mode-picker");
    const chooseJoystickButton = document.getElementById("choose-joystick");
    const chooseSensorButton = document.getElementById("choose-sensor");
    const changeModeButton = document.getElementById("change-mode");
    const joystickControls = document.getElementById("joystick-controls");
    const sensorControls = document.getElementById("sensor-controls");
    const joystickPad = document.getElementById("joystick-pad");
    const joystickThumb = document.getElementById("joystick-thumb");
    const needle = document.getElementById("needle");
    const gameButtons = [
      { button: "A", element: document.getElementById("button-a") },
      { button: "B", element: document.getElementById("button-b") },
      { button: "C", element: document.getElementById("button-c") },
    ];

    const COMPASS_THRESHOLD = 0.5;
    const JOYSTICK_DEADZONE = 0.2;
    let motionListener = null;
    let lastCompassAngle = 0;
    let socket = null;
    let activePointerId = null;
    let selectedMode = null;

    function showStatus(message, isError = false) {
      statusElement.innerText = message;
      statusElement.style.color = isError ? "#fca5a5" : "#e2e8f0";
    }

    function updateCompass(x, y) {
      const magnitude = Math.hypot(x, y);
      if (magnitude < COMPASS_THRESHOLD) {
        return;
      }

      const rawAngle = (Math.atan2(y, x) * 180) / Math.PI + 90;
      setCompassAngle(rawAngle);
    }

    function setCompassAngle(rawAngle) {
      const angle = ((rawAngle % 360) + 360) % 360;
      const delta = Math.abs(angle - ((lastCompassAngle % 360) + 360) % 360);
      const normalizedDelta = delta > 180 ? 360 - delta : delta;

      if (normalizedDelta < 2) {
        return;
      }

      lastCompassAngle = angle;
      needle.style.transform = `translate(-50%, -100%) rotate(${angle}deg)`;
    }

    function adjustForScreenOrientation(x, y) {
      const screenAngle = window.screen.orientation?.angle;
      const legacyAngle = window.orientation;
      const angle = Number.isFinite(screenAngle)
        ? screenAngle
        : (Number.isFinite(legacyAngle) ? legacyAngle : 0);
      const radians = (angle * Math.PI) / 180;
      const cos = Math.cos(radians);
      const sin = Math.sin(radians);

      return {
        x: x * cos - y * sin,
        y: x * sin + y * cos,
      };
    }

    function sendMessage(message) {
      if (socket?.readyState === WebSocket.OPEN) {
        socket.send(JSON.stringify(message));
      }
    }

    function setGameButtonsEnabled(enabled) {
      gameButtons.forEach(({ element }) => {
        element.disabled = !enabled;
      });
    }

    function detachMotionListener() {
      if (motionListener) {
        window.removeEventListener("devicemotion", motionListener);
        motionListener = null;
      }
    }

    function sendJoystickPosition(x, y) {
      sendMessage({ acceleration: { x, y, z: 0 } });
    }

    function resetJoystick() {
      joystickThumb.style.transform = "translate(-50%, -50%)";
      sendJoystickPosition(0, 0);
    }

    function moveJoystick(event) {
      const bounds = joystickPad.getBoundingClientRect();
      const centerX = bounds.width / 2;
      const centerY = bounds.height / 2;
      const radius = Math.min(centerX, centerY) * 0.72;
      let dx = (event.clientX - bounds.left - centerX) / radius;
      let dy = (event.clientY - bounds.top - centerY) / radius;
      const magnitude = Math.hypot(dx, dy);

      if (magnitude > 1) {
        dx /= magnitude;
        dy /= magnitude;
      }

      const pixelX = dx * radius;
      const pixelY = dy * radius;
      joystickThumb.style.transform = `translate(calc(-50% + ${pixelX}px), calc(-50% + ${pixelY}px))`;

      if (Math.hypot(dx, dy) < JOYSTICK_DEADZONE) {
        sendJoystickPosition(0, 0);
        return;
      }

      setCompassAngle((Math.atan2(dx, -dy) * 180) / Math.PI);
      sendJoystickPosition(-dx * 5, dy * 5);
    }

    function selectMode(mode) {
      selectedMode = mode;
      document.querySelector(".panel").classList.toggle("joystick-mode", mode === "joystick");
      modePicker.hidden = true;
      changeModeButton.hidden = false;
      joystickControls.hidden = mode !== "joystick";
      sensorControls.hidden = mode !== "sensor";
      setGameButtonsEnabled(true);
    }

    gameButtons.forEach(({ button, element }) => {
      element.addEventListener("click", () => sendMessage({ buttonPressed: button }));
    });

    chooseJoystickButton.addEventListener("click", () => {
      selectMode("joystick");
      showStatus("Controlando con el joystick");
    });

    chooseSensorButton.addEventListener("click", async () => {
      try {
        const motionApi = window.DeviceMotionEvent;
        if (!motionApi) {
          throw new Error("Este navegador no permite usar el sensor de movimiento.");
        }

        if (typeof motionApi.requestPermission === "function") {
          const permission = await motionApi.requestPermission();
          if (permission !== "granted") {
            throw new Error("Se denegó el permiso para usar el sensor de movimiento.");
          }
        }

        detachMotionListener();
        motionListener = (event) => {
          const acceleration = event.accelerationIncludingGravity || {};
          const deviceX = Number(acceleration.x) || 0;
          const deviceY = Number(acceleration.y) || 0;
          const z = Number(acceleration.z) || 0;
          const { x, y } = adjustForScreenOrientation(deviceX, deviceY);

          updateCompass(-x, y);
          sendMessage({ acceleration: { x, y, z } });
        };

        window.addEventListener("devicemotion", motionListener, { passive: true });
        selectMode("sensor");
        showStatus("Controlando con el sensor del celular");
      } catch (error) {
        showStatus(`Error: ${error.message || error}`, true);
      }
    });

    changeModeButton.addEventListener("click", () => {
      detachMotionListener();
      if (selectedMode === "joystick") {
        resetJoystick();
      } else {
        sendJoystickPosition(0, 0);
      }
      activePointerId = null;
      selectedMode = null;
      document.querySelector(".panel").classList.remove("joystick-mode");
      joystickControls.hidden = true;
      sensorControls.hidden = true;
      changeModeButton.hidden = true;
      modePicker.hidden = false;
      setGameButtonsEnabled(false);
      showStatus("Elegí un modo de control");
    });

    joystickPad.addEventListener("pointerdown", (event) => {
      if (selectedMode !== "joystick" || activePointerId !== null) {
        return;
      }

      activePointerId = event.pointerId;
      moveJoystick(event);
    });

    window.addEventListener("pointermove", (event) => {
      if (event.pointerId === activePointerId) {
        moveJoystick(event);
      }
    });

    window.addEventListener("pointerup", (event) => {
      if (event.pointerId === activePointerId) {
        activePointerId = null;
        resetJoystick();
      }
    });

    window.addEventListener("pointercancel", (event) => {
      if (event.pointerId === activePointerId) {
        activePointerId = null;
        resetJoystick();
      }
    });

    startButton.addEventListener("click", () => {
      const ip = ipInput.value.trim();
      if (!ip) {
        showStatus("Ingresá la IP de la laptop para conectar.", true);
        ipInput.focus();
        return;
      }

      const wsProtocol = window.location.protocol === "https:" ? "wss:" : "ws:";
      const wsPort = window.location.port ? `:${window.location.port}` : "";
      let wsUrl;

      try {
        wsUrl = new URL(`${wsProtocol}//${ip}${wsPort}/socket`).toString();
      } catch {
        showStatus("La dirección IP ingresada no es válida.", true);
        ipInput.focus();
        return;
      }

      startButton.disabled = true;
      showStatus("Conectando...");

      try {
        socket = new WebSocket(wsUrl);

        socket.addEventListener("open", () => {
          showStatus("Conectado. Elegí cómo querés moverte.");
          modePicker.hidden = false;
        });

        socket.addEventListener("error", () => {
          showStatus(`Error al conectar con ${wsUrl}. Revisá la IP o que el servidor esté levantado.`, true);
          detachMotionListener();
          setGameButtonsEnabled(false);
          startButton.disabled = false;
        });

        socket.addEventListener("close", (event) => {
          const reason = event.reason ? ` Motivo: ${event.reason}` : "";
          showStatus(`Conexión cerrada${reason}.`, true);
          detachMotionListener();
          modePicker.hidden = true;
          joystickControls.hidden = true;
          sensorControls.hidden = true;
          changeModeButton.hidden = true;
          activePointerId = null;
          document.querySelector(".panel").classList.remove("joystick-mode");
          setGameButtonsEnabled(false);
          startButton.disabled = false;
        });
      } catch (error) {
        showStatus(`Error: ${error.message || error}`, true);
        startButton.disabled = false;
      }
    });
  </script>
</body>

</html>
